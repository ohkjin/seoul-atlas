<!doctype html>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Mockup: the time card with a filter on (here "RHSI below −0.2": 58 of 422 neighbourhoods).
     Today its line ignores the filters. Like kepler's own time chart, it would leave out only
     the time filter (the chart is the year; the day is the playhead) and draw the year twice:
     everything, faint, and what passes the filters, in the accent. Three ways to draw it. -->
<style>
  :root { --ink: #eef2f7; --ink-2: #c4cbd5; --ink-3: #6f7886; --accent: #e8a35c; --line: rgba(255,255,255,0.08); }
  body { margin: 0; background: #0b0d11; color: var(--ink); font-family: Inter, system-ui, sans-serif; padding: 24px; width: 1120px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .opt { font: 600 13px Inter; color: var(--accent); margin: 0 0 4px; }
  .how { font-size: 11.5px; color: #a9b2bf; margin: 0 0 12px; line-height: 1.55; min-height: 72px; } .how b { color: var(--ink); font-weight: 500; }
  .card { background: rgba(22,25,31,0.94); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .head { display: flex; justify-content: space-between; }
  .day { font-size: 20px; font-weight: 300; } .dow { font-size: 11px; color: var(--ink-3); letter-spacing: .08em; margin-top: 2px; }
  .speed { display: flex; align-items: flex-start; gap: 2px; font-size: 11px; color: var(--ink-3); } .speed span { padding: 3px 8px; border-radius: 999px; }
  .speed span.on { color: var(--ink); background: rgba(255,255,255,0.08); }
  svg.chart { display: block; width: 100%; height: 64px; margin: 10px 0; border-radius: 8px; background: rgba(255,255,255,0.02); }
  .foot { display: flex; align-items: center; gap: 10px; }
  .play { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; }
  .var { flex: 1; font-size: 12px; color: var(--ink-2); line-height: 1.3; } .var small { display: block; color: var(--accent); font-size: 10.5px; }
  .now { font-size: 15px; font-weight: 300; text-align: right; line-height: 1.2; } .now small { display: block; font-size: 10.5px; color: var(--ink-3); }
  .sec { font: 600 11px Inter; color: var(--ink-3); letter-spacing: .12em; margin: 26px 0 10px; }
  .key { display: flex; gap: 12px; font-size: 10.5px; color: var(--ink-3); margin-top: 8px; } .key i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 4px; }
</style>
<body>
<div class="grid" id="g1"></div>
<div class="sec">THE SAME, ON A MEAN (MAX TEMPERATURE · SAME FILTER)</div>
<div class="grid" id="g2"></div>
<script>
const W = 288, H = 64, N = 366, DAY = 160;   // playhead on 8 June
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
// a year of Seoul's daily sales (₩100M) and the filtered places' share of it (~31%, a little
// weaker in summer — these places are the heat-sensitive ones)
const total = [], kept = [], tAll = [], tKept = [];
for (let i = 0; i < N; i++) {
  const dow = (i + 1) % 7, week = dow === 0 || dow === 6 ? 0.82 : 1;
  const season = 1 + 0.12 * Math.sin((i - 60) / N * 2 * Math.PI);
  const v = 1150 * season * week * (0.94 + 0.12 * rnd());
  total.push(v); kept.push(v * (0.31 - (i > 170 && i < 240 ? 0.04 : 0)) * (0.93 + 0.14 * rnd()));
  const temp = 13 + 16 * Math.sin((i - 105) / N * 2 * Math.PI) + 3 * (rnd() - 0.5);
  tAll.push(temp); tKept.push(temp + 0.4 + 0.6 * (rnd() - 0.5));
}
const path = (vals, lo, hi) => 'M' + vals.map((v, i) => `${(i / (N - 1) * W).toFixed(1)},${(H - 4 - (v - lo) / (hi - lo) * (H - 8)).toFixed(1)}`).join('L');
const area = (d) => `${d}L${W},${H}L0,${H}Z`;
const ext = (...a) => { const f = a.flat(); return [Math.min(...f), Math.max(...f)]; };
const head = `<line x1="${DAY / (N - 1) * W}" x2="${DAY / (N - 1) * W}" y1="0" y2="${H}" stroke="#eef2f7" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
const faintLine = (d) => `<path d="${d}" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
const accLine = (d) => `<path d="${d}" fill="none" stroke="#e8a35c" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;

function opts(all, part, unit, nowAll, nowPart, isSum) {
  const [lo, hi] = ext(all, part, isSum ? [0] : []);
  const [plo, phi] = ext(part);
  return [
    ['A · Both on one scale', 'Everything as a <b>faint line</b>; what passes the filters in the <b>accent</b>, on the same scale — for a total the accent sits low, and the gap <b>is</b> what the filter took away.',
      `<path d="${area(path(part, lo, hi))}" fill="rgba(232,163,92,0.16)"/>${faintLine(path(all, lo, hi))}${accLine(path(part, lo, hi))}`],
    ['B · Filled, like kepler', 'Kepler\'s way: the year as a <b>grey fill</b>, what passes the filters as an <b>accent fill</b> over it. Reads as "the part of the whole" at a glance; the line\'s detail is softer.',
      `<path d="${area(path(all, lo, hi))}" fill="rgba(255,255,255,0.10)"/><path d="${area(path(part, lo, hi))}" fill="rgba(232,163,92,0.45)"/>`],
    ['C · Own scale for the filtered', 'The accent line gets its <b>own scale</b> so its ups and downs are as clear as the whole\'s; the faint line keeps the whole\'s shape. The size gap moves to the words below.',
      `${faintLine(path(all, ...ext(all)))}<path d="${area(path(part, plo, phi))}" fill="rgba(232,163,92,0.12)"/>${accLine(path(part, plo, phi))}`],
  ].map(([name, how, svg]) => `
  <div><div class="opt">${name}</div><p class="how">${how}</p>
  <div class="card">
    <div class="head"><div><div class="day">2024-06-08</div><div class="dow">SATURDAY</div></div>
      <div class="speed"><span>0.5×</span><span class="on">1×</span><span>2×</span><span>↗</span></div></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${svg}${head}</svg>
    <div class="foot"><span class="play">▶</span>
      <span class="var">${unit[0]}<small>filtered · 58 / 422 places</small></span>
      <span class="now">${nowPart}<small>all ${nowAll}</small></span></div>
    <div class="key"><span><i style="background:#e8a35c"></i>passes the filters</span><span><i style="background:rgba(255,255,255,0.4)"></i>all of Seoul</span></div>
  </div></div>`).join('');
}
document.getElementById('g1').innerHTML = opts(total, kept, ['Retail sales (daily)'], '1,034억', '298억 · 29%', true);
document.getElementById('g2').innerHTML = opts(tAll, tKept, ['Max temperature (daily)'], '27.1 °C', '27.6 °C', false);
</script>
</body>
