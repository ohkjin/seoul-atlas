<!doctype html>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Mockup: the drawer row as the user laid it out — a little card where the radio was (what the
     theme's card shows), then at the right two buttons: one that makes it the map's main (its
     colour), and the link that makes it the second. Which icon says "main" without the word? -->
<style>
  :root { --ink: #eef2f7; --ink-2: #c4cbd5; --ink-3: #6f7886; --ink-4: #4a515c; --accent: #e8a35c; --line: rgba(255,255,255,0.08); }
  body { margin: 0; background: #0b0d11; color: var(--ink); font-family: Inter, system-ui, sans-serif; padding: 24px; width: 1120px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 18px; }
  .opt { font: 600 13px Inter; color: var(--accent); margin: 0 0 4px; }
  .how { font-size: 11.5px; color: #a9b2bf; margin: 0 0 10px; line-height: 1.55; min-height: 54px; } .how b { color: var(--ink); font-weight: 500; }
  .sheet { background: rgba(22,25,31,0.94); border: 1px solid var(--line); border-radius: 16px; padding: 14px; position: relative; }
  .card { border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 12px 14px; background: rgba(255,255,255,0.025); margin-bottom: 10px; }
  .t { font-size: 10px; letter-spacing: .16em; color: #a9b2bf; }
  .v { font-size: 22px; font-weight: 300; margin-top: 2px; } .s { font-size: 11px; color: var(--ink-3); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { position: relative; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 4px 0 6px; border-radius: 10px; }
  .n { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.main { background: rgba(232,163,92,0.09); } li.main .n, li.second .n, li.hover .n, li.head .n { color: var(--ink); }
  li.hover { background: rgba(255,255,255,0.05); }
  .cg { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ink-4); flex: none; }
  .cg.on { color: var(--accent); }
  .ic { width: 26px; height: 26px; display: grid; place-items: center; color: var(--ink-3); flex: none; border-radius: 7px; }
  .ic.on { color: var(--accent); }
  .ic.first { margin-left: auto; }
  li.hover .ic.first { background: rgba(255,255,255,0.08); color: var(--ink); }
  .cursor { position: absolute; font-size: 15px; color: #fff; z-index: 3; }
  .tip { position: absolute; font-size: 10.5px; background: #20242c; border: 1px solid var(--line); color: var(--ink-2); padding: 2px 7px; border-radius: 6px; white-space: nowrap; z-index: 2; }
  .sw { width: 14px; height: 14px; border-radius: 4px; box-sizing: border-box; border: 1.5px solid currentColor; }
  .sw.on { border: 0; background: linear-gradient(135deg, #2b2f6b, #6a3d8f 35%, #c0503b 70%, #f2c14e); }
  .bar { width: 14px; height: 6px; border-radius: 3px; box-sizing: border-box; border: 1.5px solid currentColor; }
  .bar.on { border: 0; background: linear-gradient(90deg, #2b2f6b, #6a3d8f, #c0503b, #f2c14e); }
</style>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></symbol>
  <symbol id="cardo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="12" rx="2.5"/><line x1="7" y1="10.5" x2="12" y2="10.5" stroke-linecap="round"/></symbol>
  <symbol id="cardf" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="2.5" fill="currentColor"/><line x1="7" y1="10.5" x2="12" y2="10.5" stroke="#16191e" stroke-width="1.75" stroke-linecap="round"/></symbol>
  <symbol id="drop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></symbol>
  <symbol id="dropf" viewBox="0 0 24 24"><path fill="currentColor" d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></symbol>
  <symbol id="map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></symbol>
  <symbol id="layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></symbol>
  <symbol id="layersf" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path fill="currentColor" d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path fill="none" d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path fill="none" d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></symbol>
  <symbol id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
</svg>

<div class="grid" id="g"></div>
<script>
// One theme, three rows: Max temperature is on the card; Apparent max temp is the map's main;
// Max temperature is also the second (link). Heat days is hovered.
const L = '<svg width="15" height="15"><use href="#link"/></svg>';
const opts = [
  ['1 · Droplet', 'Main <b>colours</b> the map, so its button is a drop of paint. Filled = this is the colour.',
    '<svg width="15" height="15"><use href="#dropf"/></svg>', '<svg width="15" height="15"><use href="#drop"/></svg>', 'Colour the map with this'],
  ['2 · The colour ramp', 'A tiny swatch of the map\'s own <b>colour ramp</b>; outlined when off. It is literally the legend you will see.',
    '<span class="sw on"></span>', '<span class="sw"></span>', 'Colour the map with this'],
  ['3 · A ramp bar', 'Same idea, flatter: a short <b>legend bar</b> — the ramp lights up when it is the main.',
    '<span class="bar on"></span>', '<span class="bar"></span>', 'Colour the map with this'],
  ['4 · Map', 'Plain <b>"on the map"</b>. Reads at once, but says less about main vs second — both are on the map.',
    '<svg width="15" height="15"><use href="#map"/></svg>', '<svg width="15" height="15"><use href="#map"/></svg>', 'Show on the map'],
  ['5 · Top layer', 'Layers with the <b>top one filled</b>: the main is the layer on top, the link joins one beneath.',
    '<svg width="15" height="15"><use href="#layersf"/></svg>', '<svg width="15" height="15"><use href="#layers"/></svg>', 'Put on top of the map'],
  ['6 · Eye', 'Show it: <b>visible</b> on the map. Familiar from layer lists; the weakest at saying "the main one".',
    '<svg width="15" height="15"><use href="#eye"/></svg>', '<svg width="15" height="15"><use href="#eye"/></svg>', 'Show on the map'],
];
document.getElementById('g').innerHTML = opts.map(([name, how, on, off, tip]) => `
<div><div class="opt">${name}</div><p class="how">${how}</p>
<div class="sheet">
  <div class="card"><div class="t">ENVIRONMENT</div><div class="v">6.68</div><div class="s">Max temperature (daily)</div></div>
  <ul>
    <li class="head second"><span class="cg on"><svg width="16" height="16"><use href="#cardf"/></svg></span><span class="n">Max temperature (daily)</span><span class="ic first">${off}</span><span class="ic on">${L}</span></li>
    <li class="main"><span class="cg"><svg width="16" height="16"><use href="#cardo"/></svg></span><span class="n">Apparent max temp</span><span class="ic first on">${on}</span><span class="ic">${L}</span></li>
    <li class="hover"><span class="cg"><svg width="16" height="16"><use href="#cardo"/></svg></span><span class="n">Heat days</span><span class="ic first">${off}</span><span class="ic">${L}</span>
      <span class="cursor" style="right:36px;top:15px">↖</span><span class="tip" style="right:14px;top:34px">${tip}</span></li>
  </ul>
</div></div>`).join('');
</script>
</body>
