<!doctype html>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Mockups for the dashboard's SHAP panel (one place, real values from UHUS shap_result):
     A all 25 as bars, B a waterfall from the base to the model's RHSI, C six groups that open. -->
<style>
  body { margin: 0; background: #0b0d11; color: #eef2f7; font-family: Inter, system-ui, sans-serif; padding: 28px; }
  .row { display: flex; gap: 22px; align-items: flex-start; }
  .opt { width: 560px; }
  .opt h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; color: #e8a35c; letter-spacing: .02em; }
  .opt p.note { margin: 10px 2px 0; font-size: 12px; color: #a9b2bf; line-height: 1.5; }
  .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 12px 14px; }
  .panel h3 { margin: 0 0 4px; font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #6f7886; }
  .sum { font-size: 11.5px; color: #a9b2bf; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .sum b { color: #eef2f7; font-weight: 600; }
  .bar { display: grid; grid-template-columns: 150px 1fr 54px; align-items: center; gap: 8px; height: 15px; font-size: 11px; }
  .bar .n { color: #a9b2bf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .v { text-align: right; font-variant-numeric: tabular-nums; color: #a9b2bf; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; }
  .track { position: relative; height: 8px; }
  .track .z { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: rgba(255,255,255,0.25); }
  .track i { position: absolute; top: 0; height: 8px; border-radius: 2px; }
  .up { background: #5fb3b3; } .down { background: #e0607e; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .wf { position: relative; height: 330px; }
  .grp { margin: 4px 0; }
  .grp .head { display: grid; grid-template-columns: 150px 1fr 54px; gap: 8px; align-items: center; font-size: 12px; height: 22px; }
  .grp .head .n { color: #eef2f7; }
  .grp .kids { margin: 2px 0 6px 14px; padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.08); }
  .legend { display: flex; gap: 14px; font-size: 10.5px; color: #a9b2bf; margin-top: 8px; }
</style>
<body>
<div class="row" id="row"></div>
<script>
fetch('shap-sample.json').then(r => r.json()).then(d => {
  const SHORT = {dinebev_share_all:'Dining share', everyday_retail_share_all:'Everyday retail', general_share_all:'General retail',
    large_format_share_all:'Large format', dinebev_share_retail:'Dining share (retail)', everyday_retail_share_retail:'Everyday retail (retail)',
    general_share_retail:'General retail (retail)', large_format_share_retail:'Large format (retail)', elderly_share:'Elderly',
    low_income_share:'Low income', subway_access_coverage:'Subway access', bus_stop_density:'Bus stops',
    residential_area_share:'Residential', commercial_area_share:'Commercial', leisure_area_share:'Leisure',
    transportation_area_share:'Transport land', public_facility_area_share:'Public facility', green_space_share:'Green space',
    activity_facility_density:'Activity venues', aged_housing_share:'Aged housing', parking_capacity:'Parking',
    land_price:'Land price', dnpr:'Day / night pop.', delta_daypop:'Heat pop. shift', retail_share:'Retail share'};
  const GROUPS = [['Sales mix','#e8a35c',['dinebev_share_all','everyday_retail_share_all','general_share_all','large_format_share_all','dinebev_share_retail','everyday_retail_share_retail','general_share_retail','large_format_share_retail','retail_share']],
    ['People','#b48ead',['elderly_share','low_income_share','dnpr','delta_daypop']],
    ['Mobility','#7dbccc',['subway_access_coverage','bus_stop_density','parking_capacity']],
    ['Land use','#a3be8c',['residential_area_share','commercial_area_share','leisure_area_share','transportation_area_share','public_facility_area_share','green_space_share']],
    ['Built form','#d08770',['activity_facility_density','aged_housing_share']],
    ['Land price','#ebcb8b',['land_price']]];
  const groupOf = {}; GROUPS.forEach(([g, c, ks]) => ks.forEach(k => groupOf[k] = [g, c]));
  const v = d.vals, keys = Object.keys(v).sort((a, b) => Math.abs(v[b]) - Math.abs(v[a]));
  const max = Math.max(...keys.map(k => Math.abs(v[k])));
  const f = x => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(3);
  const bar = (name, x, m, colour) => {
    const w = Math.abs(x) / m * 50;
    return `<div class="bar"><span class="n">${colour ? `<span class="dot" style="background:${colour}"></span>` : ''}${name}</span>
      <span class="track"><span class="z"></span><i class="${x >= 0 ? 'up' : 'down'}" style="${x >= 0 ? `left:50%` : `left:${50 - w}%`};width:${w}%"></i></span>
      <span class="v">${f(x)}</span></div>`;
  };
  const head = `<div class="sum">${d.dong}, ${d.gu} · base <b>${d.base.toFixed(3)}</b> + 25 contributions = model RHSI <b>${d.model.toFixed(3)}</b> · observed <b>${d.observed.toFixed(3)}</b></div>`;
  const legend = `<div class="legend"><span><span class="dot" style="background:#5fb3b3"></span>raises RHSI (sales hold up in heat)</span><span><span class="dot" style="background:#e0607e"></span>lowers RHSI (sales fall in heat)</span></div>`;

  // A — all 25, strongest first
  const A = `<div class="panel"><h3>What drives RHSI here — SHAP</h3>${head}${keys.map(k => bar(SHORT[k], v[k], max, groupOf[k][1])).join('')}${legend}</div>`;

  // B — waterfall: base, the 8 strongest, the other 17, model RHSI; observed marked
  const top = keys.slice(0, 8), rest = keys.slice(8).reduce((s, k) => s + v[k], 0);
  const steps = [['Base (average)', d.base, 'base'], ...top.map(k => [SHORT[k], v[k], 'step']), ['17 others', rest, 'step'], ['Model RHSI', d.model, 'total']];
  let cum = 0; const pts = steps.map(([n, x, t]) => { const from = t === 'step' ? cum : 0; cum = t === 'total' ? x : (t === 'base' ? x : cum + x); return [n, x, t, from, cum]; });
  const lo = Math.min(0, ...pts.map(p => Math.min(p[3], p[4]))) - 0.01, hi = Math.max(0, ...pts.map(p => Math.max(p[3], p[4])), d.observed) + 0.01;
  const X = val => 160 + (val - lo) / (hi - lo) * 330;
  const B = `<div class="panel"><h3>From the average to this place — SHAP</h3>${head}<svg width="530" height="${pts.length * 24 + 26}" style="display:block">
    <line x1="${X(0)}" x2="${X(0)}" y1="0" y2="${pts.length * 24}" stroke="rgba(255,255,255,0.25)"/>
    ${pts.map(([n, x, t, from, to], i) => {
      const a = Math.min(from, to), b = Math.max(from, to), col = t === 'step' ? (x >= 0 ? '#5fb3b3' : '#e0607e') : '#a9b2bf';
      return `<text x="0" y="${i * 24 + 15}" fill="${t === 'step' ? '#a9b2bf' : '#eef2f7'}" font-size="11">${n}</text>
        <rect x="${X(a)}" y="${i * 24 + 5}" width="${Math.max(1.5, X(b) - X(a))}" height="13" rx="2" fill="${col}"/>
        <text x="${X(b) + 6}" y="${i * 24 + 15}" fill="#a9b2bf" font-size="10" font-family="IBM Plex Mono">${t === 'step' ? f(x) : x.toFixed(3)}</text>`;
    }).join('')}
    <line x1="${X(d.observed)}" x2="${X(d.observed)}" y1="${(pts.length - 1) * 24}" y2="${pts.length * 24 + 2}" stroke="#e8a35c" stroke-width="2"/>
    <text x="${X(d.observed) + 6}" y="${pts.length * 24 + 16}" fill="#e8a35c" font-size="10">observed ${d.observed.toFixed(3)}</text>
  </svg>${legend}</div>`;

  // C — six groups, each a sum; the strongest opened
  const gsum = GROUPS.map(([g, c, ks]) => [g, c, ks, ks.reduce((s, k) => s + v[k], 0)]).sort((a, b) => Math.abs(b[3]) - Math.abs(a[3]));
  const gmax = Math.max(...gsum.map(x => Math.abs(x[3])));
  const C = `<div class="panel"><h3>What drives RHSI here — by group</h3>${head}${gsum.map(([g, c, ks, s], i) => `<div class="grp">
      <div class="head"><span class="n"><span class="dot" style="background:${c}"></span>${i === 0 ? '▾' : '▸'} ${g} <span style="color:#6f7886">(${ks.length})</span></span>
      <span class="track"><span class="z"></span><i class="${s >= 0 ? 'up' : 'down'}" style="${s >= 0 ? 'left:50%' : `left:${50 - Math.abs(s) / gmax * 50}%`};width:${Math.abs(s) / gmax * 50}%"></i></span>
      <span class="v" style="text-align:right;font-family:IBM Plex Mono;font-size:10.5px;color:#a9b2bf">${f(s)}</span></div>
      ${i === 0 ? `<div class="kids">${ks.slice().sort((a, b) => Math.abs(v[b]) - Math.abs(v[a])).map(k => bar(SHORT[k], v[k], gmax)).join('')}</div>` : ''}
    </div>`).join('')}${legend}</div>`;

  document.getElementById('row').innerHTML =
    `<div class="opt"><h2>A · All 25, strongest first</h2>${A}<p class="note">Every input as a bar around zero, coloured dot = its group. Complete, longest.</p></div>
     <div class="opt"><h2>B · Waterfall from the average</h2>${B}<p class="note">Base → the 8 strongest → the other 17 → the model's RHSI, with the observed RHSI marked. Shows how the number is built.</p></div>
     <div class="opt"><h2>C · Six groups, each opens</h2>${C}<p class="note">Sales mix, people, mobility, land use, built form, land price; click a group for its inputs (here the strongest is open).</p></div>`;
});
</script>
</body>
