<!doctype html>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Mockup: the dashboard's SHAP panel as option C (six groups that open) with every row a
     SHAP beeswarm: the 422 neighbourhoods as dots at their SHAP value, coloured by the input's
     own value (low blue → high red), the focused place ringed and its value on the right. -->
<style>
  body { margin: 0; background: #0b0d11; color: #eef2f7; font-family: Inter, system-ui, sans-serif; padding: 24px; }
  .panel { width: 980px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 12px 16px 14px; }
  h3 { margin: 0 0 4px; font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #6f7886; }
  .sum { font-size: 11.5px; color: #a9b2bf; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .sum b { color: #eef2f7; font-weight: 600; }
  .legend { display: flex; gap: 18px; align-items: center; font-size: 10.5px; color: #a9b2bf; margin-top: 8px; }
  .ramp { width: 90px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #3b6fd1, #c9c9d6, #e0484e); display: inline-block; vertical-align: 1px; margin: 0 6px; }
</style>
<body>
<div class="panel">
  <h3>What drives RHSI — SHAP, by group</h3>
  <div class="sum" id="sum"></div>
  <svg id="svg" width="948"></svg>
  <div class="legend">
    <span>dot = a neighbourhood · left lowers RHSI (sales fall in heat), right raises it · beyond the axis: pinned at its end</span>
    <span>input value: low<span class="ramp"></span>high</span>
    <span><svg width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="#e8a35c" stroke-width="2"/></svg> this place</span>
  </div>
</div>
<script>
const SHORT = {dinebev_share_all:'Dining share', everyday_retail_share_all:'Everyday retail', general_share_all:'General retail',
  large_format_share_all:'Large format', dinebev_share_retail:'Dining share (retail)', everyday_retail_share_retail:'Everyday retail (retail)',
  general_share_retail:'General retail (retail)', large_format_share_retail:'Large format (retail)', elderly_share:'Elderly',
  low_income_share:'Low income', subway_access_coverage:'Subway access', bus_stop_density:'Bus stops',
  residential_area_share:'Residential', commercial_area_share:'Commercial', leisure_area_share:'Leisure',
  transportation_area_share:'Transport land', public_facility_area_share:'Public facility', green_space_share:'Green space',
  activity_facility_density:'Activity venues', aged_housing_share:'Aged housing', parking_capacity:'Parking',
  land_price:'Land price', dnpr:'Day / night pop.', delta_daypop:'Heat pop. shift', retail_share:'Retail share'};
const GROUPS = [['Sales mix','#e8a35c',['dinebev_share_all','everyday_retail_share_all','general_share_all','large_format_share_all','dinebev_share_retail','everyday_retail_share_retail','general_share_retail','large_format_share_retail','retail_share']],
  ['People','#b48ead',['elderly_share','low_income_share','dnpr','delta_daypop']],
  ['Mobility','#7dbccc',['subway_access_coverage','bus_stop_density','parking_capacity']],
  ['Land use','#a3be8c',['residential_area_share','commercial_area_share','leisure_area_share','transportation_area_share','public_facility_area_share','green_space_share']],
  ['Built form','#d08770',['activity_facility_density','aged_housing_share']],
  ['Land price','#ebcb8b',['land_price']]];
fetch('shap-swarm.json').then(r => r.json()).then(d => {
  const fi = Object.fromEntries(d.feats.map((f, i) => [f, i]));
  const focus = d.rows.find(r => r.code === d.focus);
  const LABEL = 190, VALW = 70, W = 948, PLOT = W - LABEL - VALW, ROW = 34, GROW = 36, R = 1.6;
  // one x scale for every row: the widest SHAP anywhere
  // the axis reaches the 99th percentile of |SHAP|; the few beyond sit pinned at its ends
  const all = d.rows.flatMap(r => r.s).map(Math.abs).sort((a, b) => a - b);
  const lim = all[Math.floor(all.length * 0.99)] * 1.05;
  const X = v => LABEL + (Math.max(-lim, Math.min(lim, v)) + lim) / (2 * lim) * PLOT;
  const colour = t => { // blue → grey → red
    const a = [59, 111, 209], m = [201, 201, 214], b = [224, 72, 78];
    const [p, q, u] = t < 0.5 ? [a, m, t * 2] : [m, b, (t - 0.5) * 2];
    return `rgb(${p.map((c, i) => Math.round(c + (q[i] - c) * u)).join(',')})`;
  };
  // a beeswarm row: dots stacked away from the centre line where they would overlap
  const swarm = (vals, cols, y0, h) => {
    const order = vals.map((v, i) => i).sort((a, b) => vals[a] - vals[b]);
    const placed = []; let out = '';
    for (const i of order) {
      const x = X(vals[i]);
      let dy = 0;
      for (let k = 0; k < 60; k++) {
        dy = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * (R * 2 + 0.3);
        if (!placed.some(p => Math.abs(p[0] - x) < R * 2 + 0.2 && Math.abs(p[1] - dy) < R * 2 + 0.2)) break;
      }
      if (Math.abs(dy) > h / 2 - R) dy = Math.sign(dy) * (h / 2 - R);
      placed.push([x, dy]);
      out += `<circle cx="${x.toFixed(1)}" cy="${(y0 + dy).toFixed(1)}" r="${R}" fill="${cols[i]}" fill-opacity="0.85"/>`;
    }
    return out;
  };
  const rank = vals => { const s = [...vals].sort((a, b) => a - b); return v => s.indexOf(v) / (s.length - 1); };
  const sumOf = (r, ks) => ks.reduce((s, k) => s + r.s[fi[k]], 0);
  const f = x => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(3);
  let y = 6, svg = '';
  const groups = GROUPS.map(g => [...g, d.rows.map(r => sumOf(r, g[2]))])
    .sort((a, b) => Math.abs(sumOf(focus, b[2])) - Math.abs(sumOf(focus, a[2])));
  groups.forEach(([g, c, ks, sums], gi) => {
    const open = gi < 2;   // the mockup opens the two strongest groups
    const yc = y + GROW / 2;
    svg += `<text x="0" y="${yc + 4}" font-size="12.5" fill="#eef2f7"><tspan fill="${c}">●</tspan> ${open ? '▾' : '▸'} ${g} <tspan fill="#6f7886">(${ks.length})</tspan></text>`;
    svg += `<line x1="${X(0)}" x2="${X(0)}" y1="${y + 2}" y2="${y + GROW - 2}" stroke="rgba(255,255,255,0.22)"/>`;
    svg += swarm(sums, sums.map(() => 'rgba(169,178,191,0.55)'), yc, GROW - 4);
    const fs = sumOf(focus, ks);
    svg += `<circle cx="${X(fs)}" cy="${yc}" r="4.6" fill="none" stroke="#e8a35c" stroke-width="2"/>`;
    svg += `<text x="${W}" y="${yc + 4}" text-anchor="end" font-size="11" font-family="IBM Plex Mono" fill="#eef2f7">${f(fs)}</text>`;
    y += GROW;
    if (open) {
      const kids = ks.slice().sort((a, b) => Math.abs(focus.s[fi[b]]) - Math.abs(focus.s[fi[a]]));
      for (const k of kids) {
        const vals = d.rows.map(r => r.s[fi[k]]), xs = d.rows.map(r => r.x[fi[k]]), rk = rank(xs);
        const yk = y + ROW / 2;
        svg += `<line x1="14" x2="14" y1="${y}" y2="${y + ROW}" stroke="rgba(255,255,255,0.08)"/>`;
        svg += `<text x="24" y="${yk + 4}" font-size="11.5" fill="#a9b2bf">${SHORT[k]}</text>`;
        svg += `<line x1="${X(0)}" x2="${X(0)}" y1="${y + 2}" y2="${y + ROW - 2}" stroke="rgba(255,255,255,0.15)"/>`;
        svg += swarm(vals, xs.map(v => colour(rk(v))), yk, ROW - 4);
        svg += `<circle cx="${X(focus.s[fi[k]])}" cy="${yk}" r="4.6" fill="none" stroke="#e8a35c" stroke-width="2"/>`;
        svg += `<text x="${W}" y="${yk + 4}" text-anchor="end" font-size="10.5" font-family="IBM Plex Mono" fill="#a9b2bf">${f(focus.s[fi[k]])}</text>`;
        y += ROW;
      }
    }
  });
  y += 4;
  svg += `<text x="${X(-lim)}" y="${y + 10}" font-size="10" fill="#6f7886">${f(-lim)}</text>`;
  svg += `<text x="${X(0)}" y="${y + 10}" font-size="10" fill="#6f7886" text-anchor="middle">0</text>`;
  svg += `<text x="${X(lim)}" y="${y + 10}" font-size="10" fill="#6f7886" text-anchor="end">${f(lim)}</text>`;
  const s = document.getElementById('svg');
  s.setAttribute('height', y + 16);
  s.innerHTML = svg;
  const total = d.feats.reduce((t, k) => t + focus.s[fi[k]], 0);
  document.getElementById('sum').innerHTML = `${focus.name} · its 25 contributions add up to <b>${f(total)}</b> on top of the Seoul average · 422 neighbourhoods per row`;
});
</script>
</body>
