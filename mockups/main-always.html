<!doctype html>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Mockup: built on the rule that there is always exactly one main, and a second only exists
     against it. So the main is not a button you toggle — it is the selected row (click a name,
     like picking a tab; it can be replaced, never emptied). The second is the one action, and it
     is relative: the link attaches a row to the main, and says which main. -->
<style>
  :root { --ink: #eef2f7; --ink-2: #c4cbd5; --ink-3: #6f7886; --ink-4: #4a515c; --accent: #e8a35c; --line: rgba(255,255,255,0.08); }
  body { margin: 0; background: #0b0d11; color: var(--ink); font-family: Inter, system-ui, sans-serif; padding: 24px; width: 1120px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .opt { font: 600 13px Inter; color: var(--accent); margin: 0 0 4px; }
  .how { font-size: 11.5px; color: #a9b2bf; margin: 0 0 10px; line-height: 1.55; min-height: 72px; } .how b { color: var(--ink); font-weight: 500; }
  .sheet { background: rgba(22,25,31,0.94); border: 1px solid var(--line); border-radius: 16px; padding: 14px; position: relative; }
  .card { border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 12px 14px; background: rgba(255,255,255,0.025); margin-bottom: 10px; }
  .t { font-size: 10px; letter-spacing: .16em; color: #a9b2bf; }
  .v { font-size: 22px; font-weight: 300; margin-top: 2px; } .s { font-size: 11px; color: var(--ink-3); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { position: relative; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 4px 0 6px; border-radius: 10px; }
  .n { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  li.main { background: rgba(232,163,92,0.11); } li.main .n { color: var(--ink); font-weight: 500; }
  li.main::before { content: ''; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px; border-radius: 2px; background: var(--accent); }
  li.second .n, li.hover .n { color: var(--ink); }
  li.second { background: rgba(255,255,255,0.045); }
  li.hover { background: rgba(255,255,255,0.05); }
  .cg { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ink-4); flex: none; } .cg.on { color: var(--accent); }
  .ic { width: 26px; height: 26px; display: grid; place-items: center; color: var(--ink-3); flex: none; border-radius: 7px; }
  .ic.on { color: var(--accent); } .ic.hov { color: var(--ink); background: rgba(255,255,255,0.08); }
  .ic.none { visibility: hidden; }
  .cursor { position: absolute; font-size: 15px; color: #fff; z-index: 3; }
  .tip { position: absolute; font-size: 10.5px; background: #20242c; border: 1px solid var(--line); color: var(--ink-2); padding: 2px 7px; border-radius: 6px; white-space: nowrap; z-index: 2; }
  .tip b { color: var(--accent); font-weight: 500; }
  .sub { font-size: 10.5px; color: var(--ink-3); margin-left: 2px; white-space: nowrap; }
  .sub b { color: var(--accent); font-weight: 500; }
  .pin { font-size: 10px; color: var(--accent); white-space: nowrap; margin-right: 4px; }
  /* the map's left card, to show the pair as one thing */
  .side { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .k { font-size: 9.5px; letter-spacing: .14em; color: var(--ink-3); margin-bottom: 6px; }
  .fm { font-size: 13px; } .fm small { font-size: 10px; color: var(--accent); letter-spacing: .1em; margin-right: 6px; }
  .ramp { height: 5px; border-radius: 3px; margin: 5px 0 8px; background: linear-gradient(90deg, #2b2f6b, #6a3d8f, #c0503b, #f2c14e); }
  .fs { font-size: 12px; color: var(--ink-2); padding-left: 12px; border-left: 1px solid var(--line); display: flex; align-items: center; gap: 6px; }
  .fs .x { margin-left: auto; color: var(--ink-3); }
</style>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></symbol>
  <symbol id="cardo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="12" rx="2.5"/><line x1="7" y1="10.5" x2="12" y2="10.5" stroke-linecap="round"/></symbol>
  <symbol id="cardf" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="2.5" fill="currentColor"/><line x1="7" y1="10.5" x2="12" y2="10.5" stroke="#16191e" stroke-width="1.75" stroke-linecap="round"/></symbol>
</svg>
<div class="grid" id="g"></div>
<script>
const C = (on) => `<span class="cg${on ? ' on' : ''}"><svg width="16" height="16"><use href="#${on ? 'cardf' : 'cardo'}"/></svg></span>`;
const L = (cls) => `<span class="ic ${cls}"><svg width="15" height="15"><use href="#link"/></svg></span>`;
const side = `<div class="side"><div class="k">ON THE MAP</div>
  <div class="fm"><small>MAIN</small>Apparent max temp</div><div class="ramp"></div>
  <div class="fs">🔗 Max temperature (daily) <span class="x">✕</span></div></div>`;
const cards = [
  ['1 · The main is the selection', 'Click a <b>name</b> and that row becomes the main — always exactly one, like a tab: it can be replaced, never left empty. The main row has <b>no link</b> (nothing to link it to). Every other row\'s link attaches it <b>to the main</b>; the hint names the main.',
    `<li class="second">${C(true)}<span class="n">Max temperature (daily)</span>${L('on')}</li>
     <li class="main">${C(false)}<span class="n">Apparent max temp</span>${L('none')}</li>
     <li class="hover">${C(false)}<span class="n">Heat days</span>${L('hov')}<span class="cursor" style="right:10px;top:16px">↖</span><span class="tip" style="right:0;top:34px">Link to <b>Apparent max temp</b></span></li>
     <li>${C(false)}<span class="n">Mild days</span>${L('')}</li>`],
  ['2 · The second says what it is linked to', 'Same clicks. The linked row carries a small <b>"→ main name"</b>, so the pair reads as one — the second only exists hanging off the main. The main row shows a quiet <b>"on the map"</b> instead of a button.',
    `<li class="second">${C(true)}<span class="n">Max temperature (daily) <span class="sub">→ <b>Apparent max</b></span></span>${L('on')}</li>
     <li class="main">${C(false)}<span class="n">Apparent max temp</span><span class="pin">on the map</span></li>
     <li>${C(false)}<span class="n">Heat days</span>${L('')}</li>
     <li>${C(false)}<span class="n">Mild days</span>${L('')}</li>`],
  ['3 · Swap by clicking the second\'s name', 'What happens at the edges. Click the <b>second\'s name</b>: the two <b>swap</b> (it leads, the old main is linked). Click a link while one is linked: the <b>new one replaces</b> it. ✕ on the map card drops the second; the main has no ✕.',
    `<li class="main">${C(true)}<span class="n">Max temperature (daily)</span>${L('none')}</li>
     <li class="second">${C(false)}<span class="n">Apparent max temp</span>${L('on')}</li>
     <li>${C(false)}<span class="n">Heat days</span>${L('')}</li>
     <li>${C(false)}<span class="n">Mild days</span>${L('')}</li>`.replace('Max temperature (daily)</span>', 'Max temperature (daily)</span>') ],
];
document.getElementById('g').innerHTML = cards.map(([name, how, rows], i) => `
<div><div class="opt">${name}</div><p class="how">${how}</p>
<div class="sheet">
  <div class="card"><div class="t">ENVIRONMENT</div><div class="v">6.68</div><div class="s">Max temperature (daily)</div></div>
  <ul>${rows}</ul>
  ${i === 2 ? side.replace('Apparent max temp</div>', 'Max temperature (daily)</div>').replace('🔗 Max temperature (daily)', '🔗 Apparent max temp') : side}
</div></div>`).join('');
</script>
</body>
