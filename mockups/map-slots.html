<!doctype html>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Mockup: a map icon and a link icon read as two unrelated features, though both put the row on
     the map — one as the main (colour), one as the second. Ways to make them one control. -->
<style>
  :root { --ink: #eef2f7; --ink-2: #c4cbd5; --ink-3: #6f7886; --ink-4: #4a515c; --accent: #e8a35c; --line: rgba(255,255,255,0.08); }
  body { margin: 0; background: #0b0d11; color: var(--ink); font-family: Inter, system-ui, sans-serif; padding: 24px; width: 1120px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .opt { font: 600 13px Inter; color: var(--accent); margin: 0 0 4px; }
  .how { font-size: 11.5px; color: #a9b2bf; margin: 0 0 10px; line-height: 1.55; min-height: 54px; } .how b { color: var(--ink); font-weight: 500; }
  .sheet { background: rgba(22,25,31,0.94); border: 1px solid var(--line); border-radius: 16px; padding: 14px; position: relative; }
  .card { border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 12px 14px; background: rgba(255,255,255,0.025); margin-bottom: 10px; }
  .t { font-size: 10px; letter-spacing: .16em; color: #a9b2bf; }
  .v { font-size: 22px; font-weight: 300; margin-top: 2px; } .s { font-size: 11px; color: var(--ink-3); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { position: relative; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 4px 0 6px; border-radius: 10px; }
  .n { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  li.main { background: rgba(232,163,92,0.09); } li.main .n, li.second .n, li.hover .n { color: var(--ink); }
  li.hover { background: rgba(255,255,255,0.05); }
  .cg { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ink-4); flex: none; } .cg.on { color: var(--accent); }
  .cursor { position: absolute; font-size: 15px; color: #fff; z-index: 3; }
  .tip { position: absolute; font-size: 10.5px; background: #20242c; border: 1px solid var(--line); color: var(--ink-2); padding: 2px 7px; border-radius: 6px; white-space: nowrap; z-index: 2; }
  /* a: one pill, two halves */
  .seg { display: inline-flex; flex: none; border: 1px solid rgba(255,255,255,0.12); border-radius: 7px; overflow: hidden; }
  .seg > span { width: 24px; height: 20px; display: grid; place-items: center; color: var(--ink-3); font-size: 11px; font-weight: 600; }
  .seg > span + span { border-left: 1px solid rgba(255,255,255,0.12); }
  .seg > span.on1 { background: var(--accent); color: #16191e; }
  .seg > span.on2 { background: rgba(255,255,255,0.22); color: var(--ink); }
  .seg > span.hov { background: rgba(255,255,255,0.08); color: var(--ink); }
  .seg.ghost { border-color: rgba(255,255,255,0.06); }
  /* glyphs */
  .fill { width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid currentColor; box-sizing: border-box; }
  .on1 .fill { background: currentColor; }
  .bars { display: flex; align-items: flex-end; gap: 1.5px; height: 11px; } .bars i { width: 2.5px; background: currentColor; border-radius: 1px; }
  .ic { width: 26px; height: 26px; display: grid; place-items: center; color: var(--ink-3); flex: none; border-radius: 7px; position: relative; }
  .ic.on { color: var(--accent); } .ic.on2 { color: var(--ink); }
  .badge { position: absolute; right: 0; bottom: 1px; font-size: 9px; font-weight: 700; }
  .menu { position: absolute; right: 8px; top: 30px; background: #14171c; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 5px; font-size: 12px; z-index: 4; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 170px; }
  .menu div { padding: 5px 8px; border-radius: 6px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; } .menu div.h { background: rgba(255,255,255,0.08); color: var(--ink); }
  .menu small { color: var(--ink-3); margin-left: auto; font-size: 10.5px; }
</style>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="cardo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="12" rx="2.5"/><line x1="7" y1="10.5" x2="12" y2="10.5" stroke-linecap="round"/></symbol>
  <symbol id="cardf" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="2.5" fill="currentColor"/><line x1="7" y1="10.5" x2="12" y2="10.5" stroke="#16191e" stroke-width="1.75" stroke-linecap="round"/></symbol>
  <symbol id="map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></symbol>
</svg>
<div class="grid" id="g"></div>
<script>
const C = (on) => `<span class="cg${on ? ' on' : ''}"><svg width="16" height="16"><use href="#${on ? 'cardf' : 'cardo'}"/></svg></span>`;
const M = '<svg width="15" height="15"><use href="#map"/></svg>';
const fill = '<span class="fill"></span>', bars = '<span class="bars"><i style="height:5px"></i><i style="height:11px"></i><i style="height:8px"></i></span>';
// rows: [name, card?, state: 'main'|'second'|''|'hover', control html]
const opts = [
  ['A · One pill, 1 | 2', 'One control with two halves: <b>1</b> = main, <b>2</b> = second. Same shape on every row, so it reads as one thing — "which slot on the map".',
    (s) => `<span class="seg${s === '' ? ' ghost' : ''}"><span class="${s === 'main' ? 'on1' : s === 'hover' ? 'hov' : ''}">1</span><span class="${s === 'second' ? 'on2' : ''}">2</span></span>`,
    'Main on the map (colour)'],
  ['B · One pill, colour | height', 'Same pill, but the halves say <b>how</b> it shows: a filled square (colour) and bars (height / columns). No numbers to learn.',
    (s) => `<span class="seg${s === '' ? ' ghost' : ''}"><span class="${s === 'main' ? 'on1' : s === 'hover' ? 'hov' : ''}">${fill}</span><span class="${s === 'second' ? 'on2' : ''}">${bars}</span></span>`,
    'Colour the map with this'],
  ['C · One map icon, numbered', 'A single <b>map</b> icon. Click: main (1). Click on another row\'s while one is main: a small badge says which. Second via the icon\'s menu ▾.',
    (s) => `<span class="ic${s === 'main' ? ' on' : s === 'second' ? ' on2' : ''}">${M}${s === 'main' ? '<span class="badge" style="color:var(--accent)">1</span>' : s === 'second' ? '<span class="badge">2</span>' : ''}</span>`,
    'Show on the map', true],
];
document.getElementById('g').innerHTML = opts.map(([name, how, ctl, tip, menu]) => `
<div><div class="opt">${name}</div><p class="how">${how}</p>
<div class="sheet">
  <div class="card"><div class="t">ENVIRONMENT</div><div class="v">6.68</div><div class="s">Max temperature (daily)</div></div>
  <ul>
    <li class="second">${C(true)}<span class="n">Max temperature (daily)</span>${ctl('second')}</li>
    <li class="main">${C(false)}<span class="n">Apparent max temp</span>${ctl('main')}</li>
    <li class="hover">${C(false)}<span class="n">Heat days</span>${ctl('hover')}
      ${menu ? `<div class="menu"><div class="h">${M} Main <small>colour</small></div><div>${M} Second <small>height</small></div></div><span class="cursor" style="right:10px;top:16px">↖</span>`
             : `<span class="cursor" style="right:30px;top:16px">↖</span><span class="tip" style="right:6px;top:34px">${tip}</span>`}</li>
    <li>${C(false)}<span class="n">Mild days</span>${ctl('')}</li>
  </ul>
</div></div>`).join('');
</script>
</body>
